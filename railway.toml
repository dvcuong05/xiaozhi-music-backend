[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 999

# Environment variables (có thể override trong Railway dashboard)
[[deploy.environmentVariables]]
name = "XIAOZHI_WS_URL"
value = "wss://api.xiaozhi.me/mcp/"

[[deploy.environmentVariables]]
name = "NODE_ENV"
value = "production"
